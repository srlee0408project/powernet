<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>전체 흐름 — 회의록 UX</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Literata:opsz,wght@7..72,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/report-base.css" />
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" crossorigin="anonymous"></script>

<body>
  <div class="report-layout">

          </div>

          <div style="flex:1;min-width:120px;">

          <div style="flex:1;min-width:120px;">

            <strong>요약 생성</strong>
          </div>
          <div style="flex:0;color:var(--color-text-muted);align-self:center;">→</div>
          <div style="flex:1;min-width:120px;">
            <div style="width:56px;height:56px;margin:0 auto 12px;border-radius:50%;border:2px solid var(--color-primary);display:flex;align-items:center;justify-content:center;color:var(--color-primary);"><i data-lucide="list-todo"></i></div>
